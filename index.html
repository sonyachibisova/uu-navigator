    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0b0b0c;
        overflow: hidden;
        overscroll-behavior: none;
      }

      #scene {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      #scene canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      #overlay-root {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }

      /* Заглушка первых секунд: видна сразу, до загрузки и разбора кода сцены.
         Стили лежат здесь же, в разметке, поэтому не ждут ни одного запроса. */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: max(20px, env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px))
          max(20px, env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));
        box-sizing: border-box;
        background: #0b0b0c;
        color: #f2efe9;
        font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
      }

      #boot > * {
        max-width: min(26em, 100%);
      }

      #boot .boot-mark {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 56px;
        height: 56px;
        border: 2px solid rgba(242, 239, 233, 0.8);
        border-radius: 14px;
        font: 700 30px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #fff;
      }

      #boot .boot-title {
        font-size: 17px;
        font-weight: 600;
      }

      #boot .boot-text {
        margin: 0;
        font-size: 14px;
        color: rgba(242, 239, 233, 0.62);
      }

      #boot .boot-bar {
        width: 132px;
        height: 3px;
        overflow: hidden;
        border-radius: 2px;
        background: rgba(242, 239, 233, 0.14);
      }

      #boot .boot-bar::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: rgba(242, 239, 233, 0.6);
        animation: boot-run 1.3s ease-in-out infinite;
      }

      @keyframes boot-run {
        from {
          transform: translateX(-110%);
        }
        to {
          transform: translateX(260%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot .boot-bar::after {
          width: 100%;
          opacity: 0.4;
          animation: none;
        }
      }

      /* Состояние «3D не запустилось»: текст внутрь кладёт код сцены. */
      #boot.boot--error {
        gap: 10px;
        color: #f6e2dc;
        font-size: 15px;
      }

      #boot.boot--error .boot-bar {
        display: none;
      }

      #boot.boot--error .boot-mark {
        border-color: rgba(255, 156, 138, 0.75);
        color: #ff9c8a;
      }

      #boot.boot--error .boot-text,
      #boot.boot--error p {
        color: rgba(246, 226, 220, 0.78);
      }

      #boot[hidden] {
        display: none;
      }

      /* Без JavaScript заглушка загрузки врёт, поэтому её перекрывает
         отдельный экран с объяснением. Он не требует ни строчки кода. */
      #noscript {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 24px;
        box-sizing: border-box;
        background: #0b0b0c;
        color: #f2efe9;
        font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
      }

      #noscript b {
        font-size: 17px;
      }

      #noscript p {
        margin: 0;
        max-width: 26em;
        color: rgba(242, 239, 233, 0.68);
      }
    </style>
  </head>
  <body>
    <!-- Контейнер 3D-сцены: сюда рендерер three.js вставляет canvas. -->
    <div id="scene"></div>
    <!-- Корень оверлея (UI, отладочная панель) поверх сцены. -->
    <div id="overlay-root"></div>
    <!-- Видно до первого кадра. Снимается кодом сцены. -->
    <div id="boot" role="status" aria-live="polite">
      <div class="boot-mark" aria-hidden="true">3</div>
      <div class="boot-title">Британка, корпус 3</div>
      <div class="boot-bar" aria-hidden="true"></div>
      <p class="boot-text">Загружаем план здания. Первый раз это занимает пару секунд.</p>
    </div>
    <noscript>
      <div id="noscript">
        <b>Нужен JavaScript</b>
        <p>Включи JavaScript в браузере — без него план корпуса не откроется.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
